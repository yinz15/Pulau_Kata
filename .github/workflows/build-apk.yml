name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulau-kata-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Gradle
        run: |
          curl --fail --location --retry 3 --output gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip

      - name: Build test APK
        run: ./gradle-8.10.2/bin/gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pulau-kata-debug-apk
          path: pulau-kata-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
